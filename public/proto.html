<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>バトル試作：3体・プロセス制</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<style>
:root {
  --bg:#0b1020; --panel:#161f3a; --panel2:#1d2848; --line:#2e3c66;
  --text:#e8eefc; --dim:#9fb0d6; --gold:#ffd54f; --hp:#57d17a; --hp-low:#ff6b6b;
  --red:#ff5c7a; --cyan:#6fe3ff; --ok:#7fffaf; --violet:#b58bff; --orange:#ff9f6b;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  margin:0; padding:0; min-height:100%;
  background:radial-gradient(900px 500px at 50% -10%, #1a2547 0%, var(--bg) 60%);
  color:var(--text); font-family:'DotGothic16', system-ui, sans-serif; font-size:14px;
  overscroll-behavior:none;
}
#app { max-width:520px; margin:0 auto; padding:10px 12px 24px; display:flex; flex-direction:column; gap:8px; }

/* 選択 */
.title { font-size:20px; letter-spacing:1px; margin:6px 0 0; }
.sub { color:var(--dim); font-size:12px; margin:0; }
.select { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.scard {
  font-family:inherit; text-align:left; color:var(--text); cursor:pointer;
  background:linear-gradient(180deg, var(--panel2), var(--panel));
  border:1px solid var(--line); border-radius:12px; padding:12px;
}
.scard:active { transform:scale(.99); }
.scard h3 { margin:0 0 4px; font-size:15px; color:var(--gold); }
.scard p { margin:0; font-size:11px; color:var(--dim); line-height:1.6; }
.note { font-size:10px; color:#6f80a8; text-align:center; line-height:1.7; margin:8px 0 0; }

/* 上部 */
.topbar { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--dim); }
.topbar b { color:var(--text); }
.topbar .spacer { flex:1; }
.phase { font-size:10px; padding:3px 8px; border-radius:999px; border:1px solid; white-space:nowrap; }
.phase.ally { color:#9fd4ff; border-color:#3a6fd8; background:#3a6fd822; }
.phase.enemy { color:#ff9f9f; border-color:#b03a52; background:#b03a5222; }
.chipbtn { font-family:inherit; font-size:10px; padding:3px 7px; border-radius:999px; border:1px solid var(--line); background:#0e1730; color:var(--dim); cursor:pointer; }

/* 敵 */
.foes { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.foe {
  position:relative; border:1px solid var(--line); border-radius:10px; background:#0c1428f2;
  padding:5px; cursor:pointer; transition:border-color .12s;
}
.foe.target { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
.foe.dead { opacity:.32; filter:grayscale(1); cursor:default; }
.foe img { width:100%; height:62px; object-fit:contain; image-rendering:pixelated; display:block; }
.foe .name { font-size:11px; margin-top:1px; }
.foe .intent {
  font-size:11px; color:var(--gold); text-align:center; margin-top:2px;
  border:1px solid #ffd54f44; background:#ffd54f10; border-radius:5px; padding:1px 3px;
}
.foe .bar, .pc .bar { height:5px; background:#0a1124; border-radius:999px; overflow:hidden; }
.foe .bar { margin-top:3px; }
.foe .bar > i, .pc .bar > i { display:block; height:100%; background:var(--hp); }
.foe .bar > i { background:var(--red); }
.pc .bar.low > i { background:var(--hp-low); }
.foe .nums { display:flex; justify-content:space-between; font-size:9px; color:var(--dim); margin-top:2px; }
.foe.shake, .pc.shake { animation:shake .3s; }

/* 味方 */
.party { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.pc {
  position:relative; border:1px solid var(--line); border-radius:10px;
  background:linear-gradient(180deg, var(--panel2), var(--panel)); padding:6px;
}
.pc.active { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
.pc.pick { border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset; cursor:pointer; }
.pc.down { opacity:.42; filter:grayscale(.6); }
.pc .head { display:flex; gap:5px; align-items:center; }
.pc img { width:34px; height:34px; object-fit:contain; image-rendering:pixelated; }
.pc .name { font-size:11px; line-height:1.2; }
.pc .role { font-size:9px; color:var(--dim); }
.pc .bar { margin-top:4px; }
.pc .nums { display:flex; justify-content:space-between; font-size:9px; color:var(--dim); margin-top:2px; }
.pips { display:flex; gap:2px; margin-top:3px; }
.pips i { width:6px; height:6px; border-radius:50%; background:#0a1124; border:1px solid var(--line); }
.pips i.on { background:var(--gold); border-color:var(--gold); }
.chips { display:flex; flex-wrap:wrap; gap:2px; margin-top:3px; min-height:12px; }
.chips .st { font-size:9px; padding:0 3px; border-radius:4px; border:1px solid var(--line); color:var(--dim); }
.chips .st.poison { color:var(--ok); border-color:#7fffaf55; }
.chips .st.paralysis { color:var(--gold); border-color:#ffd54f55; }
.chips .st.seal { color:var(--violet); border-color:#b58bff55; }
.chips .st.atkUp { color:var(--orange); border-color:#ff9f6b55; }
.chips .st.regen { color:var(--ok); border-color:#7fffaf55; }
.chips .st.dodge { color:var(--cyan); border-color:#6fe3ff55; }

/* 行動 */
.actorline { font-size:12px; color:var(--dim); }
.actorline b { color:var(--gold); }
.actions { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
.actbtn {
  font-family:inherit; color:var(--text); background:#1a2444; border:1px solid var(--line);
  border-radius:9px; padding:6px 4px; text-align:center; cursor:pointer;
}
.actbtn:active { transform:scale(.98); }
.actbtn:disabled { opacity:.28; cursor:not-allowed; }
.actbtn .n { font-size:11px; }
.actbtn .d { font-size:9px; color:var(--dim); margin-top:1px; }
.actbtn .u { font-size:9px; color:var(--gold); margin-top:1px; }
.orders { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.order {
  font-family:inherit; font-size:9px; padding:6px 2px; border-radius:8px; cursor:pointer;
  color:var(--text); background:#0e1730; border:1px solid var(--line); text-align:center;
}
.order:disabled { opacity:.28; cursor:not-allowed; }
.order.active { border-color:var(--gold); color:var(--gold); }
.order .u { display:block; font-size:8px; color:var(--dim); }

/* ログ */
.log { height:96px; overflow-y:auto; font-size:12px; line-height:1.5; padding:6px 8px; background:#0a1124; border:1px solid var(--line); border-radius:9px; }
.log div { opacity:.55; }
.log div:last-child { opacity:1; color:#fff; }
.log .phase { color:var(--gold); opacity:.95; margin-top:5px; border-top:1px dashed #2e3c66; padding-top:3px; }
.log .bad { color:#ffb3c0; }
.log .good { color:var(--ok); }
.log .block { color:var(--cyan); }

/* 演出 */
.dmg-float {
  position:absolute; top:-2px; left:50%; transform:translateX(-50%);
  font-size:18px; font-weight:bold; color:#ff8f8f; pointer-events:none;
  text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;
  animation:rise .9s ease-out forwards; z-index:5;
}
.dmg-float.big { font-size:23px; color:#ffe27a; }
.dmg-float.heal { color:var(--ok); }
@keyframes rise {
  0% { opacity:0; transform:translate(-50%,8px) scale(.6); }
  12% { opacity:1; transform:translate(-50%,0) scale(1.15); }
  25% { transform:translate(-50%,-4px) scale(1); }
  70% { opacity:1; transform:translate(-50%,-20px) scale(1); }
  100% { opacity:0; transform:translate(-50%,-30px) scale(1); }
}
@keyframes shake {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-4px); }
  50% { transform:translateX(4px); }
  75% { transform:translateX(-2px); }
}

/* オーバーレイ */
.overlay { position:fixed; inset:0; background:#000c; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; }
.sheet { width:100%; max-width:360px; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:18px; text-align:center; }
.sheet h2 { margin:0 0 6px; font-size:22px; }
.sheet.win h2 { color:var(--ok); }
.sheet.lose h2 { color:var(--red); }
.sheet p { color:var(--dim); font-size:12px; margin:0 0 14px; line-height:1.7; }
.btn { font-family:inherit; font-size:14px; padding:11px 8px; border-radius:10px; border:1px solid var(--line); background:#222f57; color:var(--text); cursor:pointer; width:100%; margin-bottom:6px; }
.btn.primary { background:linear-gradient(180deg,#3a6fd8,#2b57b0); border-color:#5b8cf0; font-weight:bold; }
.btn.ghost { background:transparent; color:var(--dim); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* ================= データ ================= */
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

const MEMBERS = [
  { id:'gald', name:'ガルド', role:'盾', img:'/assets/npcs/role-guard.png', hp:55, atk:8, def:3 },
  { id:'yu', name:'ユウ', role:'火力', img:'/assets/hero.png', hp:38, atk:13, def:1 },
  { id:'sera', name:'セラ', role:'支援', img:'/assets/npcs/role-priest.png', hp:32, atk:6, def:1 },
];

const SKILLS = {
  gald: [
    { id:'bash', name:'盾撃', icon:'🛡', desc:'攻撃＋ブロック4（2回）', base:6, block:4, uses:2 },
    { id:'taunt', name:'挑発', icon:'📣', desc:'狙いを自分に＋ブロック6', block:6, taunt:true, uses:2 },
  ],
  yu: [
    { id:'double', name:'連撃', icon:'🗡', desc:'5×2ダメージ', base:5, hits:2, uses:2 },
    { id:'finisher', name:'必殺', icon:'🔥', desc:'テンション3：9×2', base:9, hits:2, tension:3, uses:1 },
  ],
  sera: [
    { id:'heal', name:'いやし', icon:'✚', desc:'最も減った味方を14回復', heal:14, uses:2 },
    { id:'bless', name:'祝福', icon:'✨', desc:'ユウの与ダメ+25%（3T）', buff:'atkUp', uses:1 },
    { id:'cleanse', name:'清め', icon:'🧼', desc:'状態異常を解除＋再生', cleanse:true, uses:1 },
  ],
};

const COMMON = [
  { id:'attack', name:'攻撃', icon:'⚔', desc:'通常攻撃', base:4 },
  { id:'guard', name:'防御', icon:'🛡', desc:'ブロック8', block:8 },
  { id:'charge', name:'ためる', icon:'⏫', desc:'テンション+2／ブロック4', charge:true, block:4 },
];

const ORDERS = [
  { id:'cheer', name:'意気昂揚', cost:0, desc:'テンション+1' },
  { id:'analyze', name:'精密解析', cost:1, desc:'弱点+20%' },
  { id:'dodge', name:'絶対回避', cost:2, desc:'被弾1回無効' },
  { id:'again', name:'命令再起', cost:2, desc:'追加行動' },
];

const SCENARIOS = {
  early: {
    name:'序盤 1戦目', tip:'まずは敵の意図を見る。盾で受けるか、火力で攻めるか。',
    tension:{ gald:0, yu:0, sera:0 },
    foes:[
      { id:'e1', name:'スライム', img:'/assets/enemies/slime.png', hp:40, atk:5, def:0,
        pattern:[{type:'attack',value:6},{type:'attack',value:6},{type:'defend',block:6}] },
      { id:'e2', name:'コウモリ', img:'/assets/enemies/bat.png', hp:32, atk:6, def:0,
        pattern:[{type:'attack',value:7},{type:'attack',value:7},{type:'defend',block:4}] },
    ],
  },
  late: {
    name:'終盤 入口', tip:'テンションを貯めて必殺。毒・封印・麻痺に注意。',
    tension:{ gald:2, yu:2, sera:1 },
    foes:[
      { id:'l1', name:'瘴気の虫', img:'/assets/enemies/tsumuri.png', hp:44, atk:9, def:2,
        pattern:[{type:'poison',value:4},{type:'attack',value:12},{type:'big',value:24}] },
      { id:'l2', name:'火の首', img:'/assets/enemies/baby_dragon.png', hp:52, atk:11, def:2,
        pattern:[{type:'attack',value:14},{type:'big',value:28},{type:'defend',block:10}] },
      { id:'l3', name:'呪いの腕', img:'/assets/enemies/cursed_armor.png', hp:40, atk:8, def:1,
        pattern:[{type:'seal',value:0},{type:'attack',value:10},{type:'paralyze',value:0}] },
    ],
  },
};

/* ================= 状態 ================= */
let G = null;
const P = { playing:false, queue:[], done:null, feed:[], view:null, fx:null, stepTimer:null, typeTimer:null, phaseText:null };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const pct = (n, max) => Math.max(0, Math.min(100, Math.round((n / max) * 100)));

function createGame(key) {
  const sc = SCENARIOS[key];
  const members = MEMBERS.map((m) => ({
    ...m, maxHp:m.hp, hp:m.hp, block:0,
    tension: sc.tension[m.id] || 0,
    statuses:{}, acted:false, hitThisRound:false,
  }));
  const foes = sc.foes.map((f) => ({
    ...f, maxHp:f.hp, block:0, statuses:{}, analyzed:false,
    patternIdx:1, intent:f.pattern[0],
  }));
  const uses = {};
  for (const m of MEMBERS) {
    uses[m.id] = {};
    for (const s of SKILLS[m.id]) if (s.uses) uses[m.id][s.id] = s.uses;
  }
  return {
    key, sc, round:1, side:'ally', phase:'setup', actorIdx:0,
    members, foes, uses, targetId:foes[0].id,
    taunt:0, orderUsed:false, pendingOrder:null, extra:false, auto:false, over:null,
  };
}

/* ================= 状態異常 ================= */
const STATUS_NAME = { poison:'毒', paralysis:'麻痺', seal:'封印', atkUp:'攻撃↑', regen:'再生', dodge:'回避' };
function has(t, id) { const s = t.statuses[id]; return !!(s && s.turns > 0); }
function addStatus(t, id, turns, extra = {}) { t.statuses[id] = { turns, ...extra }; }
function cleanDebuffs(t) { delete t.statuses.poison; delete t.statuses.paralysis; delete t.statuses.seal; }
function tickStatuses(t, ev, isFoe) {
  const s = t.statuses;
  if (s.poison) {
    const d = s.poison.value;
    t.hp = Math.max(0, t.hp - d);
    emit(ev, `毒が回る ${t.name}に ${d}`, { side:isFoe?'foe':'member', id:t.id, dmg:d, kind:'poison' });
    if (t.hp <= 0) emit(ev, `${t.name}は倒れた…`, null, { kind:'bad' });
  }
  if (s.regen && t.hp > 0) {
    const a = Math.min(s.regen.value, t.maxHp - t.hp);
    t.hp += a;
    emit(ev, `${t.name}は再生で ${a} 回復`, null, { kind:'good' });
  }
  for (const k of Object.keys(s)) {
    if (k === 'dodge') continue;
    s[k].turns -= 1;
    if (s[k].turns <= 0) delete s[k];
  }
}

/* ================= 進行 ================= */
function startScenario(key) {
  G = createGame(key);
  P.feed = [];
  P.playing = false; P.queue = []; P.done = null; P.view = null; P.fx = null; P.phaseText = null;
  clearTimers();
  const ev = [header(SCENARIOS[key].name)];
  emit(ev, SCENARIOS[key].tip, null, { kind:'good' });
  play(ev, beginAllySetup);
}

function beginAllySetup() {
  if (G.over) return endBattle();
  G.side = 'ally'; G.phase = 'setup'; G.orderUsed = false; G.extra = false;
  const ev = [header('味方 セットアップ')];
  emit(ev, `敵の意図：${intentLine()}`);
  play(ev, beginAllyMain);
}

function beginAllyMain() {
  if (G.over) return endBattle();
  G.phase = 'main'; G.actorIdx = 0;
  for (const m of G.members) m.acted = false;
  play([header('味方 メイン')], nextActor);
}

function nextActor() {
  if (G.over) return endBattle();
  if (G.actorIdx >= G.members.length) { beginAllyCleanup(); return; }
  const m = G.members[G.actorIdx];
  if (m.hp <= 0) { G.actorIdx += 1; nextActor(); return; }
  if (has(m, 'paralysis')) {
    delete m.statuses.paralysis;
    const ev = [];
    emit(ev, `${m.name}は麻痺で動けない`, null, { kind:'bad' });
    play(ev, () => { G.actorIdx += 1; nextActor(); });
    return;
  }
  m.acted = false;
  render();
  if (G.auto) setTimeout(autoStep, 300);
}

function act(id, auto = false) {
  if (!G || G.over || G.side !== 'ally' || G.phase !== 'main' || P.playing) return;
  const m = currentMember();
  if (!m || m.hp <= 0) return;
  if (!auto) G.auto = false;
  G.pendingOrder = null;
  const ev = [];
  resolveAction(m, id, ev);
  m.acted = true;
  checkEnd();
  play(ev, () => {
    if (G.over) return endBattle();
    if (G.extra) { G.extra = false; render(); if (G.auto) setTimeout(autoStep, 300); return; }
    G.actorIdx += 1;
    nextActor();
  });
}

function beginAllyCleanup() {
  if (G.over) return endBattle();
  G.side = 'ally'; G.phase = 'cleanup';
  const ev = [header('味方 クリーンアップ')];
  for (const m of G.members) if (m.hp > 0) tickStatuses(m, ev, false);
  for (const f of G.foes) {
    if (f.block > 0) { f.block = 0; emit(ev, `${f.name}のブロックが解除された`, null, { kind:'block' }); }
  }
  checkEnd();
  play(ev, () => { if (G.over) return endBattle(); beginEnemySetup(); });
}

function beginEnemySetup() {
  if (G.over) return endBattle();
  G.side = 'enemy'; G.phase = 'setup';
  const ev = [header('敵 セットアップ')];
  emit(ev, '敵が動き出す……');
  play(ev, beginEnemyMain);
}

function beginEnemyMain() {
  if (G.over) return endBattle();
  G.phase = 'main';
  const ev = [header('敵 メイン')];
  for (const f of G.foes) if (f.hp > 0) resolveEnemyIntent(f, ev);
  checkEnd();
  play(ev, () => { if (G.over) return endBattle(); beginEnemyCleanup(); });
}

function beginEnemyCleanup() {
  if (G.over) return endBattle();
  G.phase = 'cleanup';
  const ev = [header('敵 クリーンアップ')];
  for (const f of G.foes) if (f.hp > 0) tickStatuses(f, ev, true);
  let hadBlock = false;
  for (const m of G.members) {
    if (m.block > 0) { m.block = 0; hadBlock = true; }
    delete m.statuses.dodge;
  }
  G.taunt = 0;
  for (const f of G.foes) {
    if (f.hp <= 0) continue;
    f.intent = f.pattern[f.patternIdx % f.pattern.length];
    f.patternIdx += 1;
  }
  for (const m of G.members) m.hitThisRound = false;
  G.round += 1;
  if (hadBlock) emit(ev, '味方のブロックが解除された', null, { kind:'block' });
  checkEnd();
  play(ev, () => { if (G.over) return endBattle(); beginAllySetup(); });
}

/* ================= 行動解決 ================= */
function resolveAction(m, id, ev) {
  const skill = allSkills(m).find((s) => s.id === id);
  if (!skill) return;
  const sealed = m.statuses.seal && m.statuses.seal.turns > 0 ? m.statuses.seal.skillId : null;
  if (sealed === id) { emit(ev, `${m.name}は${skill.name}を封じられている`, null, { kind:'bad' }); return; }
  if (skill.uses && (G.uses[m.id][id] || 0) <= 0) { emit(ev, `${skill.name}の使用回数がない`); return; }
  if (skill.tension && m.tension < skill.tension) { emit(ev, `テンションが足りない`); return; }

  if (skill.charge) {
    m.tension = Math.min(6, m.tension + 2);
    m.block += skill.block || 0;
    emit(ev, `${m.name}は力をためた（テンション+2）`, null, { kind:'good' });
  } else if (skill.taunt) {
    G.taunt = 1;
    m.block += skill.block || 0;
    emit(ev, `${m.name}は挑発した（敵の狙いを自分に）`, null, { kind:'good' });
  } else if (skill.heal) {
    const t = lowestAlly();
    const amt = Math.min(skill.heal, t.maxHp - t.hp);
    if (amt <= 0) { emit(ev, `${t.name}のHPは満タンだ`, null, { kind:'bad' }); return; }
    t.hp += amt;
    emit(ev, `${m.name}のいやし！ ${t.name}のHPが ${amt} 回復`, { side:'member', id:t.id, dmg:amt, kind:'heal' }, { kind:'good' });
  } else if (skill.buff) {
    const t = G.members.filter((x) => x.hp > 0).sort((a, b) => b.atk - a.atk)[0];
    if (!t) return;
    addStatus(t, 'atkUp', 3, { mult:1.25 });
    emit(ev, `${m.name}の祝福！ ${t.name}の与ダメ+25%（3T）`, null, { kind:'good' });
  } else if (skill.cleanse) {
    const t = mostAfflicted();
    cleanDebuffs(t);
    addStatus(t, 'regen', 3, { value:6 });
    emit(ev, `${m.name}の清め！ ${t.name}の状態を解除し、再生を付与`, null, { kind:'good' });
  } else if (skill.base) {
    if (skill.block) m.block += skill.block;
    memberAttack(m, skill, ev);
  } else if (skill.block) {
    m.block += skill.block;
    emit(ev, `${m.name}は身を守っている（ブロック+${skill.block}）`, null, { kind:'block' });
  }

  if (skill.tension) m.tension = Math.max(0, m.tension - skill.tension);
  if (skill.uses) G.uses[m.id][id] -= 1;
}

function memberAttack(m, skill, ev) {
  const hits = skill.hits || 1;
  for (let i = 0; i < hits; i += 1) {
    let target = G.foes.find((f) => f.id === G.targetId && f.hp > 0) || G.foes.find((f) => f.hp > 0);
    if (!target) return;
    let raw = skill.base + m.atk * 0.5;
    if (has(m, 'atkUp')) raw *= 1.25;
    if (target.analyzed) { raw *= 1.2; target.analyzed = false; }
    const crit = Math.random() < 0.15;
    if (crit) raw *= 1.8;
    raw = Math.max(1, Math.floor(raw - target.def));
    if (target.block > 0) {
      const a = Math.min(target.block, raw);
      target.block -= a; raw -= a;
      emit(ev, `${target.name}のブロックが ${a} 軽減`, null, { kind:'block' });
    }
    if (raw <= 0) { emit(ev, `${target.name}は攻撃を防いだ`, null, { kind:'block' }); continue; }
    target.hp = Math.max(0, target.hp - raw);
    emit(ev, `${m.name}の${skill.name}！ ${target.name}に ${raw} ダメージ${crit ? '（会心）' : ''}`,
      { side:'foe', id:target.id, dmg:raw, kind:'dmg', crit });
    if (target.hp <= 0) {
      emit(ev, `${target.name}を倒した！`, null, { kind:'good' });
      if (G.targetId === target.id) G.targetId = (G.foes.find((f) => f.hp > 0) || {}).id;
    }
  }
}

function resolveEnemyIntent(f, ev) {
  const i = f.intent;
  if (i.type === 'defend') {
    f.block += i.block || 8;
    emit(ev, `${f.name}は身を守っている（ブロック+${i.block || 8}）`, null, { kind:'block' });
    return;
  }
  if (i.type === 'poison') {
    const t = pickAlly(); if (!t) return;
    addStatus(t, 'poison', 3, { value:i.value || 4 });
    emit(ev, `${f.name}の毒！ ${t.name}に毒（${i.value || 4}×3）`, null, { kind:'bad' });
    return;
  }
  if (i.type === 'seal') {
    const t = pickAlly(); if (!t) return;
    const sid = pickSealable(t);
    if (!sid) { emit(ev, `${f.name}の封印！ しかし封じる技がない`, null, { kind:'bad' }); return; }
    addStatus(t, 'seal', 2, { skillId:sid });
    emit(ev, `${f.name}の封印！ ${t.name}の「${skillName(t, sid)}」が使えない`, null, { kind:'bad' });
    return;
  }
  if (i.type === 'paralyze') {
    const t = pickAlly(); if (!t) return;
    addStatus(t, 'paralysis', 1, {});
    emit(ev, `${f.name}の麻痺！ ${t.name}は次の行動ができない`, null, { kind:'bad' });
    return;
  }
  const taunted = G.taunt > 0 ? G.members.find((x) => x.id === 'gald' && x.hp > 0) : null;
  const t = taunted || pickAlly();
  if (!t) return;
  const dmg = Math.max(1, i.value - t.def);
  damageMember(t, dmg, ev, f);
}

function damageMember(t, dmg, ev, source) {
  if (has(t, 'dodge')) {
    delete t.statuses.dodge;
    emit(ev, `${t.name}は攻撃を回避した`, null, { kind:'good' });
    return;
  }
  let remaining = dmg;
  if (t.block > 0) {
    const a = Math.min(t.block, remaining);
    t.block -= a; remaining -= a;
    emit(ev, `${t.name}のブロックが ${a} 軽減`, null, { kind:'block' });
  }
  if (remaining > 0) {
    t.hp = Math.max(0, t.hp - remaining);
    if (!t.hitThisRound) { t.hitThisRound = true; t.tension = Math.min(6, t.tension + 1); }
    emit(ev, `${source.name}の攻撃！ ${t.name}に ${remaining} ダメージ`,
      { side:'member', id:t.id, dmg:remaining, kind:'dmg' });
    if (t.hp <= 0) emit(ev, `${t.name}は倒れた…`, null, { kind:'bad' });
  }
}

/* ================= 入力 ================= */
function currentMember() {
  if (!G || G.side !== 'ally' || G.phase !== 'main') return null;
  return G.members[G.actorIdx] || null;
}
function allSkills(m) { return [...SKILLS[m.id], ...COMMON]; }
function aliveFoes() { return G.foes.filter((f) => f.hp > 0); }
function lowestAlly() {
  return G.members.filter((m) => m.hp > 0).sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0] || G.members[0];
}
function mostAfflicted() {
  const alive = G.members.filter((m) => m.hp > 0);
  return alive.sort((a, b) => countDebuffs(b) - countDebuffs(a))[0] || alive[0];
}
function countDebuffs(m) {
  return ['poison', 'paralysis', 'seal'].filter((k) => has(m, k)).length;
}
function pickAlly() {
  const alive = G.members.filter((m) => m.hp > 0);
  return alive.length ? alive[rnd(0, alive.length - 1)] : null;
}
function pickSealable(t) {
  const list = SKILLS[t.id].filter((s) => !s.uses || (G.uses[t.id][s.id] || 0) > 0);
  return list.length ? list[rnd(0, list.length - 1)].id : null;
}
function skillName(t, sid) {
  const s = allSkills(t).find((x) => x.id === sid);
  return s ? s.name : sid;
}
function canUse(m, sid) {
  const s = SKILLS[m.id].find((x) => x.id === sid);
  if (!s) return false;
  if (s.uses && (G.uses[m.id][sid] || 0) <= 0) return false;
  if (m.statuses.seal && m.statuses.seal.skillId === sid) return false;
  if (s.tension && m.tension < s.tension) return false;
  return true;
}

function useOrder(id) {
  if (!G || G.side !== 'ally' || G.phase !== 'main' || P.playing || G.over) return;
  const m = currentMember();
  if (!m) return;
  const o = ORDERS.find((x) => x.id === id);
  if (!o || G.orderUsed || m.tension < o.cost) return;
  G.auto = false;
  if (id === 'cheer' || id === 'dodge') {
    G.pendingOrder = G.pendingOrder === id ? null : id;
    render();
    return;
  }
  applyOrder(id, m);
}

function applyOrder(id, target) {
  if (!G || G.orderUsed || P.playing) return;
  const m = currentMember();
  if (!m) return;
  const o = ORDERS.find((x) => x.id === id);
  if (!o || m.tension < o.cost) return;
  m.tension -= o.cost;
  G.orderUsed = true;
  G.pendingOrder = null;
  G.auto = false;
  const ev = [];
  if (id === 'cheer') {
    if (!target || target.hp <= 0) { render(); return; }
    target.tension = Math.min(6, target.tension + 1);
    emit(ev, `指揮官命令：意気昂揚！ ${target.name}のテンション+1`, null, { kind:'good' });
  } else if (id === 'dodge') {
    if (!target || target.hp <= 0) { render(); return; }
    addStatus(target, 'dodge', 1, {});
    emit(ev, `指揮官命令：絶対回避！ ${target.name}は次の攻撃を避ける`, null, { kind:'good' });
  } else if (id === 'analyze') {
    const t = G.foes.find((f) => f.id === G.targetId && f.hp > 0) || aliveFoes()[0];
    if (!t) { render(); return; }
    t.analyzed = true;
    emit(ev, `指揮官命令：精密解析！ ${t.name}の弱点を突く（次の攻撃+20%）`, null, { kind:'good' });
  } else if (id === 'again') {
    G.extra = true;
    emit(ev, `指揮官命令：命令再起！ ${m.name}はもう一度動ける`, null, { kind:'good' });
  }
  play(ev, () => render());
}

function autoStart() {
  if (!G || G.over || G.side !== 'ally' || G.phase !== 'main' || P.playing) return;
  G.auto = true;
  autoStep();
}
function autoStep() {
  if (!G || G.over || G.side !== 'ally' || G.phase !== 'main' || P.playing) return;
  const m = currentMember();
  if (!m) return;
  act(chooseAuto(m), true);
}
function chooseAuto(m) {
  if (m.id === 'sera') {
    const low = lowestAlly();
    if (low && low.hp / low.maxHp < 0.6 && canUse(m, 'heal')) return 'heal';
    if (canUse(m, 'cleanse') && G.members.some((x) => x.hp > 0 && countDebuffs(x) > 0)) return 'cleanse';
    if (canUse(m, 'bless')) return 'bless';
    return 'attack';
  }
  if (m.id === 'yu') {
    if (m.tension >= 3 && canUse(m, 'finisher')) return 'finisher';
    if (canUse(m, 'double')) return 'double';
    return 'attack';
  }
  if (canUse(m, 'taunt') && aliveFoes().length >= 2) return 'taunt';
  if (canUse(m, 'bash')) return 'bash';
  return 'attack';
}

function mhp(m) { return P.view?.members?.[m.id]?.hp ?? m.hp; }

function mtension(m) { return P.view?.members?.[m.id]?.tension ?? m.tension; }
function mstatuses(m) { return P.view?.members?.[m.id]?.statuses ?? m.statuses; }
function fhp(f) { return P.view?.foes?.[f.id]?.hp ?? f.hp; }
function fblock(f) { return P.view?.foes?.[f.id]?.block ?? f.block; }

function fanalyzed(f) { return P.view?.foes?.[f.id]?.analyzed ?? f.analyzed; }

function pips(n) {
  let out = '';
  for (let i = 1; i <= 6; i += 1) out += `<i class="${i <= n ? 'on' : ''}"></i>`;

function statusChips(st) {

    .map((k) => `<span class="st ${k}">${STATUS_NAME[k] || k}${st[k].turns}</span>`).join('');

}
function floatFor(side, id) {
  if (!P.fx || P.fx.side !== side || P.fx.id !== id) return '';
  const f = P.fx;
  const cls = `${f.kind === 'heal' ? 'heal' : ''} ${f.crit ? 'big' : ''}`;

function phaseLabel() {
  return `${G.side === 'ally' ? '味方' : '敵'} ${G.phase === 'setup' ? 'セットアップ' : G.phase === 'main' ? 'メイン' : 'クリーンアップ'}`;

function intentText(f) {

function intentLine() {

function actionButtons(m) {

function orderButtons(m) {

      ${o.name}<span class="u">${o.cost ? `テン${o.cost}` : '無料'}</span>
    </button>`;

}

function battleHtml() {

                 data-act="target" data-id="${f.id}">

  }).join('');

  const log = P.feed.map((f) => `<div class="${f.phase ? 'phase' : ''} ${f.kind || ''}">${esc(f.text)}</div>`).join('');
  const phase = (P.playing && P.phaseText) ? P.phaseText : phaseLabel();

  return `<div class="topbar">

    </div>
    <div class="foes">${foes}</div>

    <div class="actorline">${inAllyMain
      ? (P.playing ? '演出中…' : pending ? `対象の味方をタップ（${ORDERS.find((o) => o.id === pending).name}）` : `<b>${actor.name}</b> の行動（${G.actorIdx + 1}/3）`)
      : G.over ? '' : `${G.side === 'ally' ? '味方' : '敵'}の処理中…`}</div>
    <div class="actions">${inAllyMain ? actionButtons(actor) : ''}</div>
    <div class="orders">${inAllyMain ? orderButtons(actor) : ''}</div>

    ${G.over && !P.playing ? overlayHtml() : ''}`;
}

function overlayHtml() {

/* ================= 再生 ================= */
function clearTimers() {
  if (P.stepTimer) { clearTimeout(P.stepTimer); P.stepTimer = null; }
  if (P.typeTimer) { clearInterval(P.typeTimer); P.typeTimer = null; }
}
function header(text) { return { text, phase:true, kind:null, snap:snap(), fx:null }; }
function snap() {
  const cp = (st) => Object.fromEntries(Object.entries(st).map(([k, v]) => [k, { ...v }]));
  const members = {};
  for (const m of G.members) members[m.id] = { hp:m.hp, block:m.block, tension:m.tension, statuses:cp(m.statuses) };
  const foes = {};
  for (const f of G.foes) foes[f.id] = { hp:f.hp, block:f.block, statuses:cp(f.statuses), analyzed:f.analyzed };
  return { members, foes };
}
function emit(ev, text, fx = null, opts = {}) {
  ev.push({ text, fx, kind:opts.kind || null, snap:snap() });
}
function play(events, done) {
  if (!events || !events.length) { if (done) done(); return; }
  P.playing = true;
  P.queue = events.slice();
  P.done = done || null;
  P.fx = null; P.view = null;
  nextEvent();
}
function nextEvent() {
  if (!P.playing) return;
  const ev = P.queue.shift();
  if (!ev) { finishPlay(); return; }
  if (ev.phase && /^(味方|敵)/.test(ev.text)) P.phaseText = ev.text;
  P.feed.push(ev);
  if (P.feed.length > 90) P.feed.shift();
  P.view = ev.snap || null;
  P.fx = ev.fx || null;
  render();
  const typed = ev.phase ? 0 : typeLine(ev.text);
  P.stepTimer = setTimeout(nextEvent, Math.max(240, typed + 60));
}
function typeLine(text) {
  if (P.typeTimer) { clearInterval(P.typeTimer); P.typeTimer = null; }
  const el = app.querySelector('.log div:last-child');
  if (!el) return 0;
  el.textContent = '';
  let i = 0;
  P.typeTimer = setInterval(() => {
    i += 1;
    el.textContent = text.slice(0, i);
    const box = app.querySelector('.log');
    if (box) box.scrollTop = box.scrollHeight;
    if (i >= text.length) { clearInterval(P.typeTimer); P.typeTimer = null; }
  }, 13);
  return text.length * 13;
}
function skipPlay() {
  if (!P.playing) return;
  for (const ev of P.queue) {
    P.feed.push(ev);
    if (ev.snap) P.view = ev.snap;
    if (ev.fx) P.fx = ev.fx;
  }
  P.queue = [];
  finishPlay();
}
function finishPlay() {
  clearTimers();
  P.playing = false;
  P.view = null;
  P.fx = null;
  const d = P.done; P.done = null;
  render();
  if (d) d();
}

function checkEnd() {
  if (G.over) return;
  if (G.foes.every((f) => f.hp <= 0)) G.over = 'win';
  else if (G.members.every((m) => m.hp <= 0)) G.over = 'lose';
}
function endBattle() {
  clearTimers();
  P.playing = false;
  P.queue = [];
  P.done = null;
  P.view = null;
  P.fx = null;
  render();
}

/* ================= 入力 ================= */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const a = el.dataset.act;
  if (P.playing) { skipPlay(); return; }
  if (a === 'select') { startScenario(el.dataset.key); return; }
  if (a === 'restart') { G = null; P.feed = []; render(); return; }
  if (a === 'selectbtn') { G = null; render(); return; }
  if (a === 'again') { startScenario(G.key); return; }
  if (!G) return;
  if (a === 'target') {
    const f = G.foes.find((x) => x.id === el.dataset.id);
    if (f && f.hp > 0) { G.targetId = f.id; render(); }
    return;
  }
  if (a === 'skill') { act(el.dataset.id); return; }
  if (a === 'order') { useOrder(el.dataset.id); return; }
  if (a === 'order-target') {
    const t = G.members.find((x) => x.id === el.dataset.id);
    if (G.pendingOrder && t) applyOrder(G.pendingOrder, t);
    return;
  }
  if (a === 'auto') { autoStart(); return; }
});

render();
</script>
</body>
</html>
