<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Loop RPG - DQ1風試作</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #000;
        font-family: 'DotGothic16', monospace;
      }
      #wrap { position: relative; }
      #trait-modal {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #trait-modal.hidden { display: none; }
      #trait-lv { color: #ff0; font-size: 20px; margin-bottom: 16px; }
      #trait-choices { display: flex; gap: 12px; }
      .trait-card {
        width: 150px;
        padding: 16px 8px;
        font-size: 15px;
        font-family: 'DotGothic16', monospace;
        background: #fff;
        border: 4px solid #00a;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .trait-card:hover { background: #ffeba0; }
      #status-modal {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9;
      }
      #status-modal.hidden { display: none; }
      #status-body {
        background: #000;
        border: 4px solid #fff;
        color: #fff;
        padding: 20px 28px;
        font-size: 15px;
        line-height: 1.7;
        max-width: 560px;
      }
      #status-body .st-head { color: #ff0; margin-top: 8px; }
      #status-body .st-hint { color: #888; font-size: 12px; margin-top: 8px; }
      #help { color: #888; font-size: 12px; text-align: center; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="game"></div>
      <div id="trait-modal" class="hidden">
        <div id="trait-lv"></div>
        <div id="trait-choices"></div>
      </div>
      <div id="status-modal" class="hidden">
        <div id="status-body"></div>
      </div>
      <div id="help">移動:WASD/矢印 / E・Space・Z:はなす・送り / Z:はい X:いいえ / T:ステータス / M:音ON・OFF / F2:デバッグ / <a href="/bestiary.html" style="color:#8fd3ff">ずかん</a></div>
    </div>
    <script src="/bundle.js"></script>
  </body>
</html>
